[package]
name = "parallax-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "parallax-ui"
path = "src/main.rs"

[dependencies]
parallax-cli.workspace = true
parallax-book.workspace = true
parallax-sim.workspace = true
parallax-venues.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum = "0.7"
tower = { version = "0.4", features = ["limit", "timeout", "util"] }

[workspace]
resolver = "2"
members = [
    "crates/parallax-types",
    "crates/parallax-bus",
    "crates/parallax-book",
    "crates/parallax-alpha",
    "crates/parallax-risk",
    "crates/parallax-strategy",
    "crates/parallax-venues",
    "crates/parallax-sim",
    "crates/parallax-cli",
    "crates/parallax-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
parallax-types = { path = "crates/parallax-types" }
parallax-bus = { path = "crates/parallax-bus" }
parallax-book = { path = "crates/parallax-book" }
parallax-alpha = { path = "crates/parallax-alpha" }
parallax-risk = { path = "crates/parallax-risk" }
parallax-strategy = { path = "crates/parallax-strategy" }
parallax-venues = { path = "crates/parallax-venues" }
parallax-sim = { path = "crates/parallax-sim" }
parallax-cli = { path = "crates/parallax-cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3"
thiserror = "1"
rand = "0.8"
rand_pcg = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
